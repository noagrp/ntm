<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noan Clock</title>
    <style>
        :root {
            --ultra-black: #000000;
            --pure-white: #ffffff;
            --laser-red: #ff0000;
            --silver: #c0c0c0;
            --machine-font: 'Arial Narrow', Arial, sans-serif;
        }

        body {
            background-color: var(--ultra-black);
            color: var(--silver);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--machine-font);
            overflow: hidden;
            touch-action: none;
        }

        /* CLOCK ELEMENTS */
        #clock-container {
            position: relative;
            width: clamp(280px, 85vw, 550px);
            height: clamp(280px, 85vw, 550px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hub {
            width: 8px; height: 8px;
            background: var(--pure-white);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 15px var(--pure-white);
        }

        .hand {
            position: absolute;
            bottom: 50%; left: 50%;
            transform-origin: bottom;
            background: var(--pure-white);
            border-radius: 2px;
        }

        .hr { width: 6px; height: 28%; opacity: 1; }
        .mn { width: 3.5px; height: 42%; opacity: 1; }
        .sc { width: 3px; height: 48%; background: var(--pure-white); opacity: 0.25; }

        /* RED GHOST NUMBERS */
        .ghost-number {
            position: absolute;
            font-family: var(--machine-font);
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--laser-red);
            text-shadow: 0 0 8px var(--laser-red);
            pointer-events: none;
            animation: sharp-fade 1s forwards;
            z-index: 1;
            transform: translate(-50%, -50%);
        }

        @keyframes sharp-fade {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            10% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        /* PADDLES */
        .chaser {
            position: fixed;
            pointer-events: none;
            font-family: var(--machine-font);
            color: var(--pure-white);
            font-size: 1.1rem;
            text-transform: uppercase;
            z-index: 100;
            white-space: nowrap;
            padding: 10px 20px;
        }

        #chasing-day { letter-spacing: 5px; }
        #chasing-date { opacity: 0.7; letter-spacing: 2px; color: var(--silver); }

        /* KINETIC BALL - NO STRETCH */
        #game-ball {
            position: fixed;
            top: 0;
            left: 0;
            width: 25px;
            height: 25px;
            background: var(--pure-white);
            border-radius: 50%;
            box-shadow: 0 0 30px var(--pure-white), 0 0 10px var(--pure-white);
            display: none; 
            z-index: 99;
            will-change: transform;
            /* Stable energy glow pulsing without scale distortion */
            animation: ball-glow-throb 0.6s infinite alternate ease-in-out;
        }

        @keyframes ball-glow-throb {
            from { box-shadow: 0 0 15px var(--pure-white); }
            to { box-shadow: 0 0 35px var(--pure-white); }
        }

        /* EXPLOSION PARTICLES */
        .particle {
            position: fixed;
            background: var(--pure-white);
            border-radius: 50%;
            pointer-events: none;
            z-index: 101;
            box-shadow: 0 0 8px var(--pure-white);
        }

        #digital-time {
            font-family: var(--machine-font);
            font-size: clamp(3rem, 18vw, 6rem);
            margin-top: 30px;
            letter-spacing: -2px;
            line-height: 0.9;
        }

        footer {
            position: absolute; bottom: 15px;
            font-size: 0.6rem; opacity: 0.2; letter-spacing: 4px;
        }
    </style>
</head>
<body>

    <div id="game-ball"></div>
    <div id="chasing-day" class="chaser">---</div>
    <div id="chasing-date" class="chaser">--- 00 0000</div>

    <div id="clock-container">
        <div class="hub"></div>
        <div id="h-hr" class="hand hr"></div>
        <div id="h-mn" class="hand mn"></div>
        <div id="h-sc" class="hand sc"></div>
    </div>

    <div id="digital-time">00:00</div>

    <footer>Noan Clock</footer>

    <script>
        const container = document.getElementById('clock-container');
        const dayEl = document.getElementById('chasing-day');
        const dateEl = document.getElementById('chasing-date');
        const ball = document.getElementById('game-ball');
        
        let lastSecond = -1;
        let targetX = window.innerWidth / 2, targetY = window.innerHeight / 2;
        let dayX = targetX, dayY = targetY;
        let dateX = targetX, dateY = targetY;
        
        let ballX = window.innerWidth / 2, ballY = -100;
        let velX = 4, velY = 4;
        let ballActive = false;
        const INITIAL_DELAY = 10000;
        const COOLDOWN_DELAY = 10000;

        window.addEventListener('mousemove', (e) => { targetX = e.clientX; targetY = e.clientY; });
        window.addEventListener('touchmove', (e) => { targetX = e.touches[0].clientX; targetY = e.touches[0].clientY; });

        function createExplosion(x, y) {
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 5 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                document.body.appendChild(p);

                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                let op = 1;
                const pTick = setInterval(() => {
                    p.style.left = parseFloat(p.style.left) + vx + 'px';
                    p.style.top = parseFloat(p.style.top) + vy + 'px';
                    op -= 0.025;
                    p.style.opacity = op;
                    if (op <= 0) {
                        clearInterval(pTick);
                        p.remove();
                    }
                }, 16);
            }
        }

        function triggerReset() {
            ballActive = false;
            ball.style.display = 'none';
            setTimeout(() => {
                ballY = -30;
                ballX = Math.random() * (window.innerWidth - 100) + 50;
                velY = Math.abs(velY);
                ball.style.display = 'block';
                ballActive = true;
            }, COOLDOWN_DELAY);
        }

        function processDualSurfacePhysics(paddle) {
            const rect = paddle.getBoundingClientRect();
            const bR = 12.5;
            const bCX = ballX + bR;
            const bCY = ballY + bR;

            if (bCX > rect.left && bCX < rect.right) {
                if (velY > 0 && (bCY + bR) >= rect.top && bCY < rect.top + (rect.height / 2)) {
                    velY = -Math.abs(velY);
                    ballY = rect.top - (bR * 2) - 1; 
                    return true;
                }
                if (velY < 0 && (bCY - bR) <= rect.bottom && bCY > rect.top + (rect.height / 2)) {
                    velY = Math.abs(velY);
                    ballY = rect.bottom + 1; 
                    return true;
                }
            }
            return false;
        }

        setTimeout(() => { 
            ballActive = true; 
            ball.style.display = 'block'; 
        }, INITIAL_DELAY);

        function tick() {
            const now = new Date();
            const s = now.getSeconds(), m = now.getMinutes(), h = now.getHours();

            document.getElementById('h-hr').style.transform = `rotate(${30 * h + m / 2}deg)`;
            document.getElementById('h-mn').style.transform = `rotate(${6 * m}deg)`;
            document.getElementById('h-sc').style.transform = `rotate(${6 * s}deg)`;
            document.getElementById('digital-time').innerText = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;

            const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
            const days = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
            dayEl.innerText = days[now.getDay()];
            dateEl.innerText = `${monthNames[now.getMonth()]} ${now.getDate()} ${now.getFullYear()}`;

            dayX += (targetX - dayX) * 0.1;
            dayY += (targetY - dayY) * 0.1;
            dateX += (targetX - dateX) * 0.07;
            dateY += (targetY - dateY) * 0.07;

            dayEl.style.left = `${dayX - (dayEl.offsetWidth / 2)}px`;
            dayEl.style.top = `${dayY - 40}px`;
            dateEl.style.left = `${dateX - (dateEl.offsetWidth / 2)}px`;
            dateEl.style.top = `${dateY + 20}px`;

            if (ballActive) {
                ballX += velX;
                ballY += velY;

                if (ballX <= 0 || ballX >= window.innerWidth - 25) velX *= -1;
                if (ballY <= 0) velY = Math.abs(velY);

                processDualSurfacePhysics(dayEl);
                processDualSurfacePhysics(dateEl);

                if (ballY > window.innerHeight - 25) {
                    createExplosion(ballX + 12, ballY + 12);
                    triggerReset();
                }

                // Perfect sphere translation without dynamic stretch transformations
                ball.style.transform = `translate3d(${ballX}px, ${ballY}px, 0)`;
            }

            if (s !== lastSecond) {
                spawnOppositeSharp(s);
                lastSecond = s;
            }
            requestAnimationFrame(tick);
        }

        function spawnOppositeSharp(currentSec) {
            const num = document.createElement('div');
            num.className = 'ghost-number';
            num.innerText = currentSec.toString().padStart(2, '0');
            const oppositeAngle = (currentSec * 6 + 180) % 360;
            const rect = container.getBoundingClientRect();
            const radius = rect.width * 0.38, centerX = rect.width / 2, centerY = rect.height / 2;
            const rad = (oppositeAngle - 90) * (Math.PI / 180);
            num.style.left = `${centerX + radius * Math.cos(rad)}px`;
            num.style.top = `${centerY + radius * Math.sin(rad)}px`;
            container.appendChild(num);
            setTimeout(() => num.remove(), 1000);
        }

        tick();
    </script>
</body>
</html>
